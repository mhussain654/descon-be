# Descon MPS -- the single public entry point for the admin web app (static
# files) and the Rails API. Install to /etc/nginx/sites-available/descon-mps
# and enable it (docs/deployment/aws-ec2-runbook.md).
#
#   /api/v1/...                  -> Rails (Puma on 127.0.0.1:3000)
#   /rails/active_storage/...    -> Rails (signed, short-lived file URLs)
#   everything else              -> the admin SPA in /var/www/descon-mps-web/current
#
# Adding a domain needs no change here: server_name is a catch-all and the
# certificate is read through /etc/nginx/tls/current, a symlink the runbook
# repoints at the new Let's Encrypt lineage.

upstream descon_mps_api {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line: Ubuntu 24.04 ships nginx 1.24, which has no
    # standalone `http2 on;` directive (it arrived in 1.25.1; newer versions
    # accept this form with a deprecation notice).
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The API accepts request bodies up to MAX_REQUEST_BODY_SIZE_BYTES (5 MiB
    # by default) and 2 MiB candidate imports; 8m leaves room for multipart
    # framing. Keep this in step with that variable.
    client_max_body_size 8m;
    client_body_timeout 30s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Rails API ---------------------------------------------------------
    # `^~` makes each prefix beat the static-file regex below: a signed blob URL
    # such as /rails/active_storage/blobs/proxy/<id>/photo.jpg ends in .jpg and
    # must reach Rails, not the SPA's file rules.
    location ^~ /api/v1/ {
        proxy_pass http://descon_mps_api;
        include /etc/nginx/snippets/descon-proxy-headers.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Signed file URLs (document view/download, profile photos). Streams from
    # S3 through Rails, so buffering is off and the read timeout is longer.
    location ^~ /rails/active_storage/ {
        proxy_pass http://descon_mps_api;
        include /etc/nginx/snippets/descon-proxy-headers.conf;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 180s;
    }

    # Anything else under these prefixes is not served -- never the SPA
    # fallback -- so a mistyped API path answers 404 instead of HTML 200.
    location ^~ /api/ {
        return 404;
    }

    location ^~ /rails/ {
        return 404;
    }

    # The API reference is not published on the public origin.
    location ^~ /api-docs {
        return 404;
    }

    location ^~ /openapi/ {
        return 404;
    }

    # ---- Admin SPA ---------------------------------------------------------
    root /var/www/descon-mps-web/current;
    index index.html;

    # Fingerprinted build output: cache for a year; a missing asset is a 404,
    # never index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/descon-security-headers.conf;
    }

    location ~* \.(?:js|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/descon-security-headers.conf;
    }

    # Deep links and refreshes (/admin/candidates/123 ...) fall back to the
    # SPA shell, which must never be cached so a new release is seen at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/descon-security-headers.conf;
    }
}
