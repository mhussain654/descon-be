# Phase 1 -- install this BEFORE a certificate exists, so Let's Encrypt can
# reach the HTTP-01 challenge. Plain HTTP serves only that challenge; every
# other request is refused, so no login or upload can happen over HTTP.
# Replace with descon-mps.conf once the certificate has been issued
# (docs/deployment/aws-ec2-runbook.md, "TLS for the Elastic IP").
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 503 "TLS is not configured yet.\n";
    }
}
