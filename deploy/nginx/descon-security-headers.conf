# Included by descon-mps.conf into every static (SPA) location. add_header is
# not inherited into a location that sets its own, hence a shared snippet.
# Install to /etc/nginx/snippets/descon-security-headers.conf.
#
# Deliberately absent:
# * Strict-Transport-Security -- with a 6-day IP-address certificate a lapse
#   would lock browsers out with no click-through. Enable it (long max-age)
#   when the site moves to a domain with ordinary renewals.
# * Content-Security-Policy enforcement -- React Router's SPA shell contains
#   four inline <script> blocks whose bytes change every build, so a strict
#   script-src needs per-build hashes. The policy below is Report-Only until
#   that is added; see the runbook ("Content-Security-Policy").
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ucarecdn.com; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
