# Install to /etc/nginx/snippets/descon-proxy-headers.conf.
# X-Forwarded-For is overwritten, not appended: Rack::Attack and the audit
# trail key on the client address, and a client-supplied header must not be
# able to choose it. Client-IP is cleared for the same reason: some office
# proxies add it with the user's private address, and Rails then rejects the
# request as IP spoofing (a 500 on staff login) because it disagrees with
# X-Forwarded-For. Puma is bound to loopback, so these are the only values
# Rails ever sees.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Client-IP "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
