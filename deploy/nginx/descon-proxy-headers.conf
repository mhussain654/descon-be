# Install to /etc/nginx/snippets/descon-proxy-headers.conf.
# X-Forwarded-For is overwritten, not appended: Rack::Attack and the audit
# trail key on the client address, and a client-supplied header must not be
# able to choose it. Puma is bound to loopback, so these are the only values
# Rails ever sees.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
