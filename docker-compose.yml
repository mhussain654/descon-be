services:
  api:
    build:
      context: .
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    env_file:
      - .env.development
    environment:
      DB_HOST: db
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - db

  worker:
    build:
      context: .
    command: bundle exec bin/jobs
    env_file:
      - .env.development
    environment:
      DB_HOST: db
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
  bundle:
