plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
    - tmp/**/*
    - log/**/*
    - db/schema.rb
    - db/cache_schema.rb
    - db/queue_schema.rb
    - db/cable_schema.rb

Metrics/BlockLength:
  Exclude:
    - config/environments/*.rb
    - config/routes.rb
    - spec/**/*.rb

Metrics/MethodLength:
  Exclude:
    - app/services/authentication/refresh_service.rb
    - db/migrate/20260819173159_devise_create_users.rb
    - db/migrate/20260819173246_create_sessions.rb
    - db/migrate/20260819173248_create_refresh_tokens.rb
    - db/migrate/20260820070000_harden_auth_foundation.rb
    - db/migrate/20260822110000_create_roles_and_permissions.rb
    - db/migrate/20260822111000_create_reference_catalogs.rb
    - db/migrate/20260822111100_create_candidates_and_candidate_assignments.rb
    - db/migrate/20260822111200_create_candidate_histories_and_documents.rb
    - db/migrate/20260822111300_create_payments_communications_and_audit_events.rb
    - db/migrate/20260822111400_add_core_relational_constraints.rb
    - db/migrate/20260823130000_create_candidate_sessions_and_refresh_tokens.rb
    - db/migrate/20260823130001_create_candidate_otp_challenges.rb

Metrics/AbcSize:
  Exclude:
    - app/services/authentication/refresh_service.rb
    - db/migrate/20260822110000_create_roles_and_permissions.rb
    - db/migrate/20260822111100_create_candidates_and_candidate_assignments.rb
    - db/migrate/20260822111200_create_candidate_histories_and_documents.rb
    - db/migrate/20260822111300_create_payments_communications_and_audit_events.rb

# These exact migrations remain intentionally exempt because they are generated
# auth foundation snapshots or schema snapshots whose table/constraint shape is
# clearer than additional extraction would be.
Metrics/ClassLength:
  Exclude:
    - db/migrate/20260822110000_create_roles_and_permissions.rb
    - db/migrate/20260822111400_add_core_relational_constraints.rb

Style/Documentation:
  Enabled: false

Lint/MissingSuper:
  Exclude:
    - app/services/**/*.rb

Layout/LineLength:
  Exclude:
    - config/initializers/devise.rb

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

# Rake tasks aren't classes, so these specs describe the task name as a
# string (same as request specs describing an endpoint path); the tasks
# under test load once via Rails.application.load_tasks and touch no
# database records, so a one-time before(:all) is safe here even with
# use_transactional_fixtures.
RSpec/DescribeClass:
  Exclude:
    - spec/tasks/**/*.rb

RSpec/BeforeAfterAll:
  Exclude:
    - spec/tasks/**/*.rb
