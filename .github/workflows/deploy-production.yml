name: Deploy backend (production)

# Deploys the commit that just passed CI -- in this same run, so the tested
# commit and the deployed commit cannot differ -- to the EC2 instance through
# AWS Systems Manager Run Command. No SSH is opened to GitHub and no AWS
# secret is stored in GitHub: the job assumes an IAM role through OIDC for the
# few minutes it runs. See docs/deployment/aws-ec2-runbook.md ("Continuous
# delivery") for the one-time AWS and GitHub settings this needs.
#
# It does nothing until the repository variables below are set, and the
# `production` environment should require a reviewer.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production-backend
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy this commit
    needs: ci
    # Skipped (not failed) until the AWS role and instance id are configured.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: descon-be-deploy-${{ github.run_id }}

      - name: Deploy the exact commit on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A custom SSM document with one pattern-validated parameter: the
          # role can start exactly this deploy, not an arbitrary command.
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name DesconDeployBackend \
            --parameters "commitSha=${COMMIT_SHA}" \
            --comment "descon-be ${COMMIT_SHA}" \
            --query Command.CommandId --output text)"
          echo "SSM command: ${command_id}"

          status=Pending
          for _ in $(seq 1 180); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)"
            case "$status" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{stdout: StandardOutputContent, stderr: StandardErrorContent}' --output text || true
          echo "Final status: ${status}"
          [[ "$status" == "Success" ]]
