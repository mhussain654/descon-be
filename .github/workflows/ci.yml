name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Reused by deploy.yml so the commit that is deployed is the commit these
  # checks ran on, in the same workflow run. `ref` is that commit; empty means
  # the event's own commit (normal pull_request/push behavior).
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to check out and test
        type: string
        required: false
        default: ''

env:
  RAILS_ENV: test
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  TEST_DB_NAME: rails_api_base_test
  TEST_CACHE_DB_NAME: rails_api_base_test_cache
  TEST_QUEUE_DB_NAME: rails_api_base_test_queue
  TEST_CABLE_DB_NAME: rails_api_base_test_cable
  JWT_SECRET: test-secret
  CORS_ALLOWED_ORIGINS: http://localhost:3000

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare database
        run: bundle exec rails db:prepare

      - name: RSpec
        run: bundle exec rspec

  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Brakeman
        run: bin/brakeman --no-pager

      - name: Bundler Audit
        run: bundle exec bundle-audit check --update

  integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare database
        run: bundle exec rails db:prepare

      - name: Zeitwerk check
        run: bundle exec rails zeitwerk:check

      - name: OpenAPI validation
        run: bundle exec rails openapi:validate

  deployment_tooling:
    name: Deployment tooling (shellcheck, env loader, nginx routing, deploy rehearsal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: ShellCheck
        run: shellcheck deploy/bin/* deploy/rehearsal/* deploy/test/*.sh

      - name: Environment loader behaviour
        run: deploy/test/with_env_test.sh

      - name: Which commits a deploy may take
        run: deploy/test/commit_policy_test.sh

      - name: Nginx routing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo systemctl stop nginx
          deploy/test/nginx_routing_test.sh

      - name: Capistrano rehearsal (release, rollback, lock)
        run: deploy/rehearsal/run
