# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  create_database_backup:
    class: Backups::CreateDatabaseBackupJob
    queue: default
    # "End of day" = the start of the next day, UTC -- stated explicitly since
    # the phrase is otherwise timezone-ambiguous.
    schedule: at midnight every day
  reconcile_stuck_ai_calls:
    class: AiCalls::ReconcileStuckCallsJob
    queue: default
    schedule: every minute
