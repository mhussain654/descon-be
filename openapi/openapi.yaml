      required: [id, candidate, assignment, submitted_at, review]
    AdminCandidateDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requirement_code:
          type: string
        required:
          type: boolean
        name:
          type: string
        file_name:
          type: string
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        file_size:
          type: integer
        uploaded_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [uploaded, pending_review, verified, rejected]
        verified_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        rejection_reason:
          anyOf:
            - type: string
            - type: 'null'
        reviewer:
          description: Present once the document has been reviewed. Never includes a personal name or email -- role is the only safe reviewer detail available.
          anyOf:
            - $ref: '#/components/schemas/AdminReviewer'
            - type: 'null'
        issued_on:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        expires_on:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        compliance_status:
          anyOf:
            - type: string
              enum: [current, near_expiry, expired, not_applicable]
            - type: 'null'
      required:
        - id
        - requirement_code
        - required
        - name
        - file_name
        - content_type
        - file_size
        - uploaded_at
        - status
    AdminDocumentSubmissionDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidate:
          $ref: '#/components/schemas/AdminDocumentSubmissionCandidate'
        assignment:
          $ref: '#/components/schemas/AdminDocumentSubmissionAssignment'
        submitted_at:
          type: string
          format: date-time
        review:
          $ref: '#/components/schemas/AdminDocumentReviewSummary'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AdminCandidateDocument'
      required: [id, candidate, assignment, submitted_at, review, documents]
    AdminDocumentAccess:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [document_id, url, expires_at]
    AdminDocumentReviewDecision:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/AdminCandidateDocument'
        submission:
          type: object
          properties:
            id:
              type: string
              format: uuid
            review:
              $ref: '#/components/schemas/AdminDocumentReviewSummary'
          required: [id, review]
      required: [document, submission]
    AdminDocumentRejectionRequest:
      type: object
      properties:
        rejection:
          type: object
          required: [reason]
          properties:
            reason:
              type: string
              minLength: 10
              maxLength: 500
      required: [rejection]
    CandidateImportRequest:
      type: object
      properties:
        candidate_import:
          type: object
          required: [file]
          properties:
            file:
              type: string
              format: binary
      required: [candidate_import]
    CandidateImportRowError:
      type: object
      properties:
        row:
          type: integer
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required: [row, field, code, message]
    CandidateImportResult:
      type: object
      properties:
        successful_rows:
          type: integer
        failed_rows:
          type: integer
        skipped_rows:
          type: integer
        total_rows:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CandidateImportRowError'
      required: [successful_rows, failed_rows, skipped_rows, total_rows, errors]
    CandidateImportPreflightCommitRequest:
      type: object
      properties:
        candidate_import:
          type: object
          required: [preflight_token]
          properties:
            preflight_token:
              type: string
              minLength: 32
      required: [candidate_import]
    CandidateImportPreflightResult:
      type: object
      properties:
        import_id: { type: string, format: uuid }
        preflight_token:
          type: string
          description: Opaque, short-lived token; commit submits it unchanged.
        expires_at: { type: string, format: date-time }
        accepted_rows: { type: integer }
        rejected_rows: { type: integer }
        warning_count: { type: integer }
        total_rows: { type: integer }
        errors:
          type: array
          items: { $ref: '#/components/schemas/CandidateImportRowError' }
      required: [import_id, preflight_token, expires_at, accepted_rows, rejected_rows, warning_count, total_rows, errors]
    CandidateImportRowResult:
      type: object
      properties:
        row_number: { type: integer, minimum: 2 }
        status: { type: string, enum: [accepted, rejected, skipped, committed] }
        error_field: { type: string, nullable: true }
        error_code: { type: string, nullable: true }
        message: { type: string, nullable: true }
      required: [row_number, status]
    CandidateImportHistoryBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, partial, failed, invalidated] }
        source_filename: { type: string }
        template_version: { type: string, example: v1 }
        total_rows: { type: integer }
        accepted_rows: { type: integer }
        rejected_rows: { type: integer }
        skipped_rows: { type: integer }
        committed_rows: { type: integer }
        imported_rows: { type: integer }
        error_code: { type: string, nullable: true }
        enqueued_at: { type: string, format: date-time, nullable: true }
        processed_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        row_results:
          type: array
          items: { $ref: '#/components/schemas/CandidateImportRowResult' }
      required: [id, status, source_filename, template_version, total_rows, accepted_rows, rejected_rows, skipped_rows, committed_rows, imported_rows, expires_at, created_at]
    HostedCheckoutNotificationRequest:
      type: object
      properties:
        orderid:
          type: string
        transactionid:
          anyOf:
            - type: string
            - type: 'null'
        amount:
          type: string
        currency:
          anyOf:
            - type: string
            - type: 'null'
        status:
          type: string
          enum: [SUCCESS, FAILED, CANCELLED]
        responsecode:
          type: string
        signature:
          type: string
      required: [orderid, amount, status, responsecode, signature]
    HostedCheckoutNotificationResult:
      type: object
      properties:
        payment:
          $ref: '#/components/schemas/CandidatePaymentRecord'
        workflow:
          $ref: '#/components/schemas/CandidateWorkflowState'
      required: [payment, workflow]
    CandidateSessionPayload:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        session:
          type: object
          properties:
            id:
              type: string
        candidate:
          $ref: '#/components/schemas/CandidateProfile'
      required: [access_token, refresh_token, token_type, expires_in, session, candidate]
    SuccessEnvelope:
      type: object
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required: [data, meta, errors]
paths:
  /api/v1/health/live:
    get:
      summary: Liveness probe
