        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateOtpVerifyRequest'
      responses:
        '201':
          description: Verified
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                verified:
                  summary: English response
                  value:
                    data:
                      access_token: token
                      refresh_token: refresh
                      token_type: Bearer
                      expires_in: 900
                      session:
                        id: 6b1a6f2e-4c8e-4b2a-8b3e-1e9a2c4d5e6f
