openapi: 3.1.0
info:
  title: Descon Manpower API
  version: 1.0.0
components:
  parameters:
    XLocaleHeader:
      in: header
      name: X-Locale
      schema:
        type: string
      description: Preferred response locale, for example `en` or `ur`.
    AcceptLanguageHeader:
      in: header
      name: Accept-Language
      schema:
        type: string
      description: RFC 9110 language preferences used when `X-Locale` is not provided or unsupported.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      schema:
        type: string
        pattern: '^[A-Za-z0-9:_-]{1,128}$'
        maxLength: 128
      description: Optional idempotency key for replay-safe mutation requests. Keys are scoped per operation and authenticated subject, retained for 12 hours, replay the original safe response for an identical request, return `409` while an identical request is still processing, and return `409` if the same key is reused with a different request fingerprint.
    PageNumber:
      in: query
      name: page[number]
      schema:
        type: integer
        minimum: 1
      description: 1-based page number.
    PageSize:
      in: query
      name: page[size]
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Number of records per page. Values above 100 are rejected.
    UserSort:
      in: query
      name: sort
      schema:
        type: string
        enum: [created_at, -created_at, email, -email, public_id, -public_id, role, -role, staff_state, -staff_state]
      description: Allowlisted sort fields for user collections.
    UserRoleFilter:
      in: query
      name: filter[role]
      schema:
        type: string
      description: Comma-separated role codes.
    UserActiveFilter:
      in: query
      name: filter[active]
      schema:
        type: string
        enum: ['true', 'false']
      description: Filter by active state. Only `true` and `false` are accepted.
    UserEmailFilter:
      in: query
      name: filter[email]
      schema:
        type: string
      description: Case-insensitive partial match on email.
    UserStaffStateFilter:
      in: query
      name: filter[staff_state]
      schema:
        type: string
      description: Comma-separated staff states. Supported values are `invited`, `active`, and `suspended`.
    DocumentSubmissionStatusFilter:
      in: query
      name: filter[status]
      schema:
        type: string
      description: Comma-separated review states. Supported values are `pending_review`, `partially_reviewed`, `changes_required`, and `verified`.
    DocumentSubmissionCandidateFilter:
      in: query
      name: filter[candidate_public_id]
      schema:
        type: string
        format: uuid
      description: Filter by candidate public ID.
    DocumentSubmissionProjectFilter:
      in: query
      name: filter[project_code]
      schema:
        type: string
      description: Filter by project code.
    DocumentSubmissionCountryFilter:
      in: query
      name: filter[country_code]
      schema:
        type: string
      description: Filter by country code.
    DocumentSubmissionSubmittedFromFilter:
      in: query
      name: filter[submitted_from]
      schema:
        type: string
        format: date-time
      description: Include submissions created on or after this ISO 8601 timestamp.
    DocumentSubmissionSubmittedToFilter:
      in: query
      name: filter[submitted_to]
      schema:
        type: string
        format: date-time
      description: Include submissions created on or before this ISO 8601 timestamp.
  headers:
    ContentLanguageHeader:
      schema:
        type: string
      description: Locale used for the translated parts of the standard JSON API response.
    VaryLanguageHeaders:
      schema:
        type: string
        example: Accept-Language, X-Locale
      description: Indicates that caches should vary on locale request headers.
    RequestIdHeader:
      schema:
        type: string
      description: Correlation identifier for the request lifecycle.
    IdempotencyReplayedHeader:
      schema:
        type: string
        example: 'true'
      description: Present when a prior successful response was replayed for the same idempotency key.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    candidateBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [request_id, timestamp]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer
      required: [page, per_page, total_count, total_pages]
    ErrorItem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message]
    ErrorEnvelope:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [errors, request_id, timestamp]
    LoginRequest:
      type: object
      properties:
        auth:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
            password:
              type: string
      required: [auth]
    RefreshRequest:
      type: object
      properties:
        auth:
          type: object
          required: [refresh_token]
          properties:
            refresh_token:
              type: string
      required: [auth]
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, hr, mps, finance, management]
        permissions:
          type: array
          items:
            type: string
      required: [id, email, role, permissions]
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, hr, mps, finance, management]
        staff_state:
          type: string
          enum: [invited, active, suspended]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, email, role, staff_state, active, created_at]
    UserCreateRequest:
      type: object
      properties:
        user:
          type: object
          required: [email, role]
          properties:
            email:
              type: string
              format: email
            role:
              type: string
              enum: [admin, hr, mps, finance, management]
      required: [user]
    UserUpdateRequest:
      type: object
      properties:
        user:
          type: object
          properties:
            role:
              type: string
              enum: [admin, hr, mps, finance, management]
            staff_state:
              type: string
              enum: [active, suspended]
      required: [user]
    UserInvitationAcceptanceRequest:
      type: object
      properties:
        invitation:
          type: object
          required: [token, password, password_confirmation]
          properties:
            token:
              type: string
            password:
              type: string
              minLength: 8
            password_confirmation:
              type: string
              minLength: 8
      required: [invitation]
    SessionPayload:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        session:
          type: object
          properties:
            id:
              type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      required: [access_token, refresh_token, token_type, expires_in, session, user]
    CandidateOtpRequestRequest:
      type: object
      properties:
        candidate:
          type: object
          required: [cnic]
          properties:
            cnic:
              type: string
              example: 42101-1234567-1
      required: [candidate]
    CandidateOtpRequestResponse:
      type: object
      properties:
        expires_in_seconds:
          type: integer
          description: How long a requested code remains valid for, once sent. Present identically whether or not the CNIC actually resolved to a candidate.
        resend_after_seconds:
          type: integer
          description: Minimum time before another code may be requested for the same CNIC.
      required: [expires_in_seconds, resend_after_seconds]
    CandidateOtpVerifyRequest:
      type: object
      properties:
        candidate:
          type: object
          required: [cnic, otp]
          properties:
            cnic:
              type: string
              example: 42101-1234567-1
            otp:
              type: string
              example: '123456'
      required: [candidate]
    CandidateProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        masked_cnic:
          type: string
          example: 42101-*******-1
        reference_number:
          type: string
        preferred_locale:
          type: string
          enum: [en, ur]
        candidate_status:
          type: string
          example: registered
        current_workflow_stage:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
          required: [code, name]
        active:
          type: boolean
      required: [id, full_name, masked_cnic, reference_number, preferred_locale, candidate_status, active]
    CandidateDocumentMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        file_size:
          type: integer
        uploaded_at:
          type: string
          format: date-time
      required: [id, file_name, content_type, file_size, uploaded_at]
    CandidateDocumentChecklistItem:
      type: object
      properties:
        requirement_code:
          type: string
          example: passport
        name:
          type: string
        required:
          type: boolean
        status:
          type: string
          enum: [missing, uploaded, pending_review, verified, rejected]
        replacement_allowed:
          type: boolean
        document:
          anyOf:
            - $ref: '#/components/schemas/CandidateDocumentMetadata'
            - type: 'null'
      required: [requirement_code, name, required, status, replacement_allowed, document]
    CandidateDocumentUploadRequest:
      type: object
      properties:
        candidate_document:
          type: object
          required: [requirement_code, file]
          properties:
            requirement_code:
              type: string
              example: passport
            file:
              type: string
              format: binary
      required: [candidate_document]
    CandidateBlockingRequirement:
      type: object
      properties:
        requirement_code:
          type: string
          example: passport
        name:
          type: string
        reason:
          type: string
          enum: [missing, rejected]
      required: [requirement_code, name, reason]
    CandidateProgressWorkflowStage:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required: [code, name]
    CandidateApplicationProgressDocuments:
      type: object
      properties:
        required_total:
          type: integer
        missing:
          type: integer
        uploaded:
          type: integer
        pending_review:
          type: integer
        verified:
          type: integer
        rejected:
          type: integer
        submitted_total:
          type: integer
        completion_percentage:
          type: integer
          minimum: 0
          maximum: 100
        can_submit:
          type: boolean
        submission_state:
          type: string
          enum:
            - no_assignment
            - no_requirements
            - incomplete
            - ready
            - submitted
            - partially_verified
            - verified
            - changes_required
        blocking_requirements:
          type: array
          items:
            $ref: '#/components/schemas/CandidateBlockingRequirement'
      required:
        - required_total
        - missing
        - uploaded
        - pending_review
        - verified
        - rejected
        - submitted_total
        - completion_percentage
        - can_submit
        - submission_state
        - blocking_requirements
    CandidateApplicationProgress:
      type: object
      properties:
        candidate_status:
          type: string
          example: registered
        current_workflow_stage:
          anyOf:
            - $ref: '#/components/schemas/CandidateProgressWorkflowStage'
            - type: 'null'
        documents:
          $ref: '#/components/schemas/CandidateApplicationProgressDocuments'
      required: [candidate_status, current_workflow_stage, documents]
    CandidateDocumentSubmissionResult:
      type: object
      properties:
        message:
          type: string
        submission_id:
          type: string
          format: uuid
        submitted_at:
          type: string
          format: date-time
        submission_state:
          type: string
          enum: [submitted, partially_verified, verified]
        documents:
          type: object
          properties:
            required_total:
              type: integer
            pending_review:
              type: integer
            can_submit:
              type: boolean
          required: [required_total, pending_review, can_submit]
      required: [message, submission_id, submitted_at, submission_state, documents]
    AdminReviewState:
      type: string
      enum: [pending_review, partially_reviewed, changes_required, verified]
    AdminReferenceRecord:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required: [code, name]
    AdminDocumentReviewSummary:
      type: object
      properties:
        pending_review:
          type: integer
        verified:
          type: integer
        rejected:
          type: integer
        required_total:
          type: integer
        review_state:
          $ref: '#/components/schemas/AdminReviewState'
      required: [pending_review, verified, rejected, required_total, review_state]
    AdminDocumentSubmissionCandidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
      required: [id, full_name]
    AdminDocumentSubmissionAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference_number:
          type: string
        country:
          $ref: '#/components/schemas/AdminReferenceRecord'
        project:
          $ref: '#/components/schemas/AdminReferenceRecord'
        craft:
          $ref: '#/components/schemas/AdminReferenceRecord'
      required: [id, reference_number, country, project, craft]
    AdminDocumentReviewQueueItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidate:
          $ref: '#/components/schemas/AdminDocumentSubmissionCandidate'
        assignment:
          $ref: '#/components/schemas/AdminDocumentSubmissionAssignment'
        submitted_at:
          type: string
          format: date-time
        review:
          $ref: '#/components/schemas/AdminDocumentReviewSummary'
      required: [id, candidate, assignment, submitted_at, review]
    AdminCandidateDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requirement_code:
          type: string
        required:
          type: boolean
        name:
          type: string
        file_name:
          type: string
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        file_size:
          type: integer
        uploaded_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [uploaded, pending_review, verified, rejected]
        verified_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        rejection_reason:
          anyOf:
            - type: string
            - type: 'null'
        reviewer_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
      required:
        - id
        - requirement_code
        - required
        - name
        - file_name
        - content_type
        - file_size
        - uploaded_at
        - status
    AdminDocumentSubmissionDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidate:
          $ref: '#/components/schemas/AdminDocumentSubmissionCandidate'
        assignment:
          $ref: '#/components/schemas/AdminDocumentSubmissionAssignment'
        submitted_at:
          type: string
          format: date-time
        review:
          $ref: '#/components/schemas/AdminDocumentReviewSummary'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AdminCandidateDocument'
      required: [id, candidate, assignment, submitted_at, review, documents]
    AdminDocumentAccess:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [document_id, url, expires_at]
    AdminDocumentReviewDecision:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/AdminCandidateDocument'
        submission:
          type: object
          properties:
            id:
              type: string
              format: uuid
            review:
              $ref: '#/components/schemas/AdminDocumentReviewSummary'
          required: [id, review]
      required: [document, submission]
    AdminDocumentRejectionRequest:
      type: object
      properties:
        rejection:
          type: object
          required: [reason]
          properties:
            reason:
              type: string
              minLength: 10
              maxLength: 500
      required: [rejection]
    CandidateImportRequest:
      type: object
      properties:
        candidate_import:
          type: object
          required: [file]
          properties:
            file:
              type: string
              format: binary
      required: [candidate_import]
    CandidateImportRowError:
      type: object
      properties:
        row:
          type: integer
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required: [row, field, code, message]
    CandidateImportResult:
      type: object
      properties:
        successful_rows:
          type: integer
        failed_rows:
          type: integer
        skipped_rows:
          type: integer
        total_rows:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CandidateImportRowError'
      required: [successful_rows, failed_rows, skipped_rows, total_rows, errors]
    CandidateSessionPayload:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        session:
          type: object
          properties:
            id:
              type: string
        candidate:
          $ref: '#/components/schemas/CandidateProfile'
      required: [access_token, refresh_token, token_type, expires_in, session, candidate]
    SuccessEnvelope:
      type: object
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required: [data, meta, errors]
paths:
  /api/v1/health/live:
    get:
      summary: Liveness probe
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      responses:
        '200':
          description: Application is live
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                live:
                  summary: English liveness response
                  value:
                    data:
                      status: ok
                      message: Application is live.
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-22T09:00:00Z'
                    errors: []
  /api/v1/health/ready:
    get:
      summary: Readiness probe
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      responses:
        '200':
          description: Application is ready
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                ready:
                  summary: English readiness response
                  value:
                    data:
                      status: ready
                      message: Application is ready.
                    meta:
                      request_id: 8026848e-b092-4041-8062-d6d2c3f8d0c6
                      timestamp: '2026-08-22T09:00:01Z'
                    errors: []
        '503':
          description: Service unavailable
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                dependencyUnavailable:
                  summary: Readiness dependency unavailable
                  value:
                    errors:
                      - code: service_unavailable
                        message: Service is temporarily unavailable.
                    request_id: a9fe75dc-5233-4ca2-bf76-45745af67d6d
                    timestamp: '2026-08-23T09:00:02Z'
  /api/v1/auth/login:
    post:
      summary: Authenticate a staff user
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Authenticated
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                created:
                  summary: English login response
                  value:
                    data:
                      access_token: token
                      refresh_token: refresh
                      token_type: Bearer
                      expires_in: 900
                      message: Login succeeded.
                      session:
                        id: 1d4d7d56-332f-4eb2-a32e-2c79a350af43
                      user:
                        id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                        email: admin@example.com
                        role: admin
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-23T09:00:00Z'
                    errors: []
                createdUrdu:
                  summary: Urdu login response
                  value:
                    data:
                      access_token: token
                      refresh_token: refresh
                      token_type: Bearer
                      expires_in: 900
                      message: لاگ اِن کامیاب رہا۔
                      session:
                        id: 1d4d7d56-332f-4eb2-a32e-2c79a350af43
                      user:
                        id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                        email: admin@example.com
                        role: admin
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-23T09:00:00Z'
                    errors: []
        '400':
          description: Missing parameter
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingParameter:
                  value:
                    errors:
                      - code: bad_request
                        field: auth
                        message: A required parameter is missing.
                    request_id: 40f8cc3a-87e8-4973-a6a1-9c8dfcc55f44
                    timestamp: '2026-08-23T09:00:03Z'
        '401':
          description: Invalid credentials
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidCredentialsEn:
                  value:
                    errors:
                      - code: unauthorized
                        message: Invalid credentials.
                    request_id: 7cc9f1f9-53e4-4e64-98f6-d7e2f4b89d39
                    timestamp: '2026-08-23T09:00:04Z'
                invalidCredentialsUr:
                  value:
                    errors:
                      - code: unauthorized
                        message: درست اسناد فراہم نہیں کی گئیں۔
                    request_id: 7cc9f1f9-53e4-4e64-98f6-d7e2f4b89d39
                    timestamp: '2026-08-23T09:00:04Z'
        '403':
          description: Inactive account
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
