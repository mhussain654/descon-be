  /api/v1/candidate/document_submissions:
    post:
      summary: Submit candidate documents for review
      description: >-
        Atomically submits the authenticated candidate's current uploaded documents for
        review. The backend locks the current assignment, re-resolves active requirements,
        rechecks readiness, moves only current `uploaded` documents to `under_verification`,
        records immutable submission evidence, and replays the original successful result
        for the same authenticated candidate and idempotency key. This endpoint does not
        accept candidate IDs, assignment IDs, document IDs, or requirement lists from the
        client.
      security:
        - candidateBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '201':
