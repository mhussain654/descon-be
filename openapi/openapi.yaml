  /api/v1/user_invitation:
    patch:
      summary: Accept a staff invitation
      description: Accepts a single-use expiring staff invitation token from the filtered request body, sets the initial password, and activates the invited staff account. The plaintext invitation token is only delivered out-of-band and is never persisted.
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvitationAcceptanceRequest'
            examples:
              acceptInvitation:
                value:
                  invitation:
                    token: invitation-token-from-email
                    password: Password123!
                    password_confirmation: Password123!
      responses:
        '200':
          description: Invitation accepted and account activated
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                invitationAccepted:
