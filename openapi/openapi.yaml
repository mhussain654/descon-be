                    meta:
                      request_id: 92a1d41e-d4aa-4bf3-9838-c0af7080f363
                      timestamp: '2026-09-15T10:05:00Z'
                    errors: []
        '401':
          description: Missing, invalid, expired, or revoked staff session
        '403':
          description: Authenticated staff user lacks manage_candidates or is inactive
        '404':
          description: Candidate not found
        '409':
          description: expected_updated_at no longer matches the current candidate/assignment state
