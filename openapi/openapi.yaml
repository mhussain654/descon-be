  /api/v1/candidate/document_submissions:
    post:
      summary: Submit candidate documents for review
      description: >-
        Atomically submits the authenticated candidate's current uploaded documents for
        review. The backend locks the current assignment, re-resolves active requirements,
        rechecks readiness, moves only current `uploaded` documents to `under_verification`,
        records immutable submission evidence, and replays the original successful result
        for the same authenticated candidate and idempotency key. This endpoint does not
        accept candidate IDs, assignment IDs, document IDs, or requirement lists from the
        client. An expired required PCC is not valid submission evidence and blocks the
        submission with blocker reason `expired`.
      security:
        - candidateBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '201':
          description: Documents submitted for review or idempotent success replayed
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                submittedEn:
                  summary: English submission response
                  value:
                    data:
                      message: Documents submitted for review.
                      submission_id: 0f5b8c9a-4f88-440d-94eb-cf70f780ff95
                      submitted_at: '2026-08-26T12:00:00Z'
                      submission_state: submitted
