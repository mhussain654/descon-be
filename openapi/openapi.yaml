  /api/v1/admin/payments/{payment_id}/corrections:
    post:
      summary: Apply a correction to one payment (finance workspace)
      description: >-
        Requires the active `manage_payments` permission. See
        `AdminPaymentCorrectionRequest` for exactly what corrections are allowed and why --
        this endpoint never lets staff invent a provider outcome; `status_code` may only
        move to `paid` when backed by a real, already-recorded provider-success event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - in: path
          name: payment_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correction:
                  $ref: '#/components/schemas/AdminPaymentCorrectionRequest'
              required: [correction]
      responses:
        '201':
          description: Correction applied; returns the updated payment detail
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Missing Idempotency-Key header
        '401':
          description: Missing, invalid, expired, or revoked staff access token
        '403':
          description: Authenticated staff user lacks manage_payments, or is inactive
        '404':
          description: Payment public ID not found
        '409':
          description: >-
            Either the payment changed since `expected_updated_at` (`stale_payment`), or an
            identical idempotent request is already processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                stale:
                  value:
                    errors:
                      - code: stale_payment
                        message: This payment changed before this correction could be applied. Refresh and try again.
                    request_id: e6ab6bbd-0ba0-492a-923b-e2af86f7079f
                    timestamp: '2026-09-03T10:00:03Z'
        '422':
          description: >-
            Validation failure (blank reason, malformed value) or a disallowed correction
            (`payment_correction_not_allowed`) -- an unsupported field, an unsupported
            status transition, or a `status_code` correction to `paid` without a matching
            open `terminal_event_conflict` finding and real provider evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                notAllowed:
                  value:
                    errors:
                      - code: payment_correction_not_allowed
                        field: correction.value
                        message: This correction is not allowed for this payment.
                    request_id: e6ab6bbd-0ba0-492a-923b-e2af86f7079f
                    timestamp: '2026-09-03T10:00:03Z'
