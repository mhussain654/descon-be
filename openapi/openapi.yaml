            project_code:
              type: string
            craft_code:
              type: string
            reference_number:
              type: string
          additionalProperties: false
      required: [candidate]
    AdminCandidateUpdateRequest:
      type: object
      description: >-
        Every field is optional -- only the fields actually being changed
        should be sent. cnic and reference_number are never accepted here;
        both are immutable once the candidate is created.
        country_code/project_code/craft_code are only accepted while the
        candidate's assignment has not moved past documents_pending.
      properties:
        candidate:
          type: object
          properties:
            full_name:
              type: string
            mobile_number:
              type: string
            passport_number:
              type: string
              description: Send blank to clear a previously recorded passport number.
            next_of_kin_name:
              type: string
              description: Must be supplied with every other next-of-kin field, or all next-of-kin fields may be blank.
            next_of_kin_relationship:
              type: string
            next_of_kin_mobile_number:
              type: string
            next_of_kin_cnic:
              type: string
            preferred_locale:
              type: string
              enum: [en, ur]
            country_code:
              type: string
            project_code:
              type: string
            craft_code:
              type: string
            expected_updated_at:
              type: string
              format: date-time
              description: Echo the detail response's own updated_at to guard against overwriting a concurrent change.
          additionalProperties: false
      required: [candidate]
