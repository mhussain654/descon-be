openapi: 3.1.0
info:
  title: Descon Manpower API
  version: 1.0.0
components:
  parameters:
    XLocaleHeader:
      in: header
      name: X-Locale
      schema:
        type: string
      description: Preferred response locale, for example `en` or `ur`.
    AcceptLanguageHeader:
      in: header
      name: Accept-Language
      schema:
        type: string
      description: RFC 9110 language preferences used when `X-Locale` is not provided or unsupported.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      schema:
        type: string
      description: Optional idempotency key for replay-safe sensitive mutation requests.
    PageNumber:
      in: query
      name: page[number]
      schema:
        type: integer
        minimum: 1
      description: 1-based page number.
    PageSize:
      in: query
      name: page[size]
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Number of records per page.
    UserSort:
      in: query
      name: sort
      schema:
        type: string
        enum: [created_at, -created_at, email, -email, public_id, -public_id, role, -role]
      description: Allowlisted sort fields for user collections.
    UserRoleFilter:
      in: query
      name: filter[role]
      schema:
        type: string
      description: Comma-separated role codes.
    UserActiveFilter:
      in: query
      name: filter[active]
      schema:
        type: boolean
      description: Filter by active state.
    UserEmailFilter:
      in: query
      name: filter[email]
      schema:
        type: string
      description: Case-insensitive partial match on email.
  headers:
    ContentLanguageHeader:
      schema:
        type: string
      description: Locale used for the translated parts of the standard JSON API response.
    VaryLanguageHeaders:
      schema:
        type: string
        example: Accept-Language, X-Locale
      description: Indicates that caches should vary on locale request headers.
    RequestIdHeader:
      schema:
        type: string
      description: Correlation identifier for the request lifecycle.
    IdempotencyReplayedHeader:
      schema:
        type: string
        example: 'true'
      description: Present when a prior successful response was replayed for the same idempotency key.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [request_id, timestamp]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer
      required: [page, per_page, total_count, total_pages]
    ErrorItem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
      required: [code, message]
    ErrorEnvelope:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [errors, request_id, timestamp]
    LoginRequest:
      type: object
      properties:
        auth:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
            password:
              type: string
      required: [auth]
    RefreshRequest:
      type: object
      properties:
        auth:
          type: object
          required: [refresh_token]
          properties:
            refresh_token:
              type: string
      required: [auth]
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
      required: [id, email, role]
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, email, role, active, created_at]
    SessionPayload:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        session:
          type: object
          properties:
            id:
              type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      required: [access_token, refresh_token, token_type, expires_in, session, user]
    SuccessEnvelope:
      type: object
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required: [data, meta, errors]
paths:
  /api/v1/health/live:
    get:
      summary: Liveness probe
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      responses:
        '200':
          description: Application is live
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                live:
                  summary: English liveness response
                  value:
                    data:
                      status: ok
                      message: Application is live.
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-22T09:00:00Z'
                    errors: []
  /api/v1/health/ready:
    get:
      summary: Readiness probe
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      responses:
        '200':
          description: Application is ready
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                ready:
                  summary: English readiness response
                  value:
                    data:
                      status: ready
                      message: Application is ready.
                    meta:
                      request_id: 8026848e-b092-4041-8062-d6d2c3f8d0c6
                      timestamp: '2026-08-22T09:00:01Z'
                    errors: []
        '503':
          description: Service unavailable
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                dependencyUnavailable:
                  summary: Readiness dependency unavailable
                  value:
                    errors:
                      - code: service_unavailable
                        message: Service is temporarily unavailable.
                    request_id: a9fe75dc-5233-4ca2-bf76-45745af67d6d
  /api/v1/auth/login:
    post:
      summary: Authenticate a staff user
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Authenticated
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                created:
                  value:
                    data:
                      access_token: token
                      refresh_token: refresh
                      token_type: Bearer
                      expires_in: 900
                      session:
                        id: 1d4d7d56-332f-4eb2-a32e-2c79a350af43
                      user:
                        id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                        email: admin@example.com
                        role: admin
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-23T09:00:00Z'
                    errors: []
        '400':
          description: Missing parameter
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
        '401':
          description: Invalid credentials
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
        '409':
          description: Idempotency conflict
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
        '429':
          description: Rate limited
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token rotated
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Missing parameter
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
        '401':
          description: Invalid refresh token
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
        '429':
          description: Rate limited
  /api/v1/auth/logout:
    delete:
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Invalid access token
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
  /api/v1/users/profile:
    get:
      summary: Fetch the authenticated user profile
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated profile
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Invalid access token
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
        '403':
          description: Forbidden
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
  /api/v1/users:
    get:
      summary: List staff users
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/UserSort'
        - $ref: '#/components/parameters/UserRoleFilter'
        - $ref: '#/components/parameters/UserActiveFilter'
        - $ref: '#/components/parameters/UserEmailFilter'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated user collection
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                collection:
                  value:
                    data:
                      - id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                        email: admin@example.com
                        role: admin
                        active: true
                        created_at: '2026-08-23T09:00:00Z'
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-23T09:00:01Z'
                      pagination:
                        page: 1
                        per_page: 20
                        total_count: 1
                        total_pages: 1
                    errors: []
        '400':
          description: Unsupported filter or sort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidFilter:
                  value:
                    errors:
                      - code: unsupported_filter
                        field: filter.password_digest
                        message: One or more filters are not supported.
                    request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                    timestamp: '2026-08-23T09:00:01Z'
        '401':
          description: Invalid access token
        '403':
          description: Forbidden
