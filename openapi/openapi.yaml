openapi: 3.1.0
info:
  title: Rails API Base
  version: 1.0.0
paths:
  /api/v1/health/live:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Application is live
  /api/v1/auth/login:
    post:
      summary: Authenticate a staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  type: object
                  required:
                    - email
                    - password
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
      responses:
        "201":
          description: Authenticated
