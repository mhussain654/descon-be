openapi: 3.1.0
info:
  title: Descon Manpower API
  version: 1.0.0
components:
  parameters:
    XLocaleHeader:
      in: header
      name: X-Locale
      schema:
        type: string
      description: Preferred response locale, for example `en` or `ur`.
    AcceptLanguageHeader:
      in: header
      name: Accept-Language
      schema:
        type: string
      description: RFC 9110 language preferences used when `X-Locale` is not provided or unsupported.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      schema:
        type: string
        pattern: '^[A-Za-z0-9:_-]{1,128}$'
        maxLength: 128
      description: Optional idempotency key for replay-safe mutation requests. Keys are scoped per operation and authenticated subject, retained for 12 hours, replay the original safe response for an identical request, return `409` while an identical request is still processing, and return `409` if the same key is reused with a different request fingerprint.
    PageNumber:
      in: query
      name: page[number]
      schema:
        type: integer
        minimum: 1
      description: 1-based page number.
    PageSize:
      in: query
      name: page[size]
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Number of records per page. Values above 100 are rejected.
    UserSort:
      in: query
      name: sort
      schema:
        type: string
        enum: [created_at, -created_at, email, -email, public_id, -public_id, role, -role, staff_state, -staff_state]
      description: Allowlisted sort fields for user collections.
    UserRoleFilter:
      in: query
      name: filter[role]
      schema:
        type: string
      description: Comma-separated role codes.
    UserActiveFilter:
      in: query
      name: filter[active]
      schema:
        type: string
        enum: ['true', 'false']
      description: Filter by active state. Only `true` and `false` are accepted.
    UserEmailFilter:
      in: query
      name: filter[email]
      schema:
        type: string
      description: Case-insensitive partial match on email.
    UserStaffStateFilter:
      in: query
      name: filter[staff_state]
      schema:
        type: string
      description: Comma-separated staff states. Supported values are `invited`, `active`, and `suspended`.
  headers:
    ContentLanguageHeader:
      schema:
        type: string
      description: Locale used for the translated parts of the standard JSON API response.
    VaryLanguageHeaders:
      schema:
        type: string
        example: Accept-Language, X-Locale
      description: Indicates that caches should vary on locale request headers.
    RequestIdHeader:
      schema:
        type: string
      description: Correlation identifier for the request lifecycle.
    IdempotencyReplayedHeader:
      schema:
        type: string
        example: 'true'
      description: Present when a prior successful response was replayed for the same idempotency key.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    candidateBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [request_id, timestamp]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer
      required: [page, per_page, total_count, total_pages]
    ErrorItem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
      required: [code, message]
    ErrorEnvelope:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [errors, request_id, timestamp]
    LoginRequest:
      type: object
      properties:
        auth:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
            password:
              type: string
      required: [auth]
    RefreshRequest:
      type: object
      properties:
        auth:
          type: object
          required: [refresh_token]
          properties:
            refresh_token:
              type: string
      required: [auth]
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, hr, mps, finance, management]
        permissions:
          type: array
          items:
            type: string
      required: [id, email, role, permissions]
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, hr, mps, finance, management]
        staff_state:
          type: string
          enum: [invited, active, suspended]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, email, role, staff_state, active, created_at]
    UserCreateRequest:
      type: object
      properties:
        user:
          type: object
          required: [email, role]
          properties:
            email:
              type: string
              format: email
            role:
              type: string
              enum: [admin, hr, mps, finance, management]
      required: [user]
    UserUpdateRequest:
      type: object
      properties:
        user:
          type: object
          properties:
            role:
              type: string
              enum: [admin, hr, mps, finance, management]
            staff_state:
              type: string
              enum: [active, suspended]
      required: [user]
    UserInvitationAcceptanceRequest:
      type: object
      properties:
        invitation:
          type: object
          required: [token, password, password_confirmation]
          properties:
            token:
              type: string
            password:
              type: string
              minLength: 8
            password_confirmation:
              type: string
              minLength: 8
      required: [invitation]
    SessionPayload:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        session:
          type: object
          properties:
            id:
              type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      required: [access_token, refresh_token, token_type, expires_in, session, user]
    CandidateOtpRequestRequest:
      type: object
      properties:
        candidate:
          type: object
          required: [cnic]
          properties:
            cnic:
              type: string
              example: 42101-1234567-1
      required: [candidate]
    CandidateOtpRequestResponse:
      type: object
      properties:
        expires_in_seconds:
          type: integer
          description: How long a requested code remains valid for, once sent. Present identically whether or not the CNIC actually resolved to a candidate.
        resend_after_seconds:
          type: integer
          description: Minimum time before another code may be requested for the same CNIC.
      required: [expires_in_seconds, resend_after_seconds]
    CandidateOtpVerifyRequest:
      type: object
      properties:
        candidate:
          type: object
          required: [cnic, otp]
          properties:
            cnic:
              type: string
              example: 42101-1234567-1
            otp:
              type: string
              example: '123456'
      required: [candidate]
    CandidateProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        masked_cnic:
          type: string
          example: 42101-*******-1
        reference_number:
          type: string
        preferred_locale:
          type: string
          enum: [en, ur]
        candidate_status:
          type: string
          example: registered
        current_workflow_stage:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
          required: [code, name]
        active:
          type: boolean
      required: [id, full_name, masked_cnic, reference_number, preferred_locale, candidate_status, active]
    CandidateDocumentMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        file_size:
          type: integer
        uploaded_at:
          type: string
          format: date-time
      required: [id, file_name, content_type, file_size, uploaded_at]
    CandidateDocumentChecklistItem:
      type: object
      properties:
        requirement_code:
          type: string
          example: passport
        name:
          type: string
        required:
          type: boolean
        status:
          type: string
          enum: [missing, uploaded, pending_review, verified, rejected]
        replacement_allowed:
          type: boolean
        document:
          anyOf:
            - $ref: '#/components/schemas/CandidateDocumentMetadata'
            - type: 'null'
      required: [requirement_code, name, required, status, replacement_allowed, document]
    CandidateDocumentUploadRequest:
      type: object
      properties:
        candidate_document:
          type: object
          required: [requirement_code, file]
          properties:
            requirement_code:
              type: string
              example: passport
            file:
              type: string
              format: binary
      required: [candidate_document]
    CandidateImportRequest:
      type: object
      properties:
        candidate_import:
          type: object
          required: [file]
          properties:
            file:
              type: string
              format: binary
      required: [candidate_import]
    CandidateImportRowError:
      type: object
      properties:
        row:
          type: integer
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required: [row, field, code, message]
    CandidateImportResult:
      type: object
      properties:
        successful_rows:
          type: integer
        failed_rows:
          type: integer
        skipped_rows:
          type: integer
        total_rows:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CandidateImportRowError'
      required: [successful_rows, failed_rows, skipped_rows, total_rows, errors]
    CandidateSessionPayload:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        session:
          type: object
          properties:
            id:
              type: string
        candidate:
          $ref: '#/components/schemas/CandidateProfile'
      required: [access_token, refresh_token, token_type, expires_in, session, candidate]
    SuccessEnvelope:
      type: object
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required: [data, meta, errors]
paths:
  /api/v1/health/live:
    get:
      summary: Liveness probe
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      responses:
        '200':
          description: Application is live
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                live:
                  summary: English liveness response
                  value:
                    data:
                      status: ok
                      message: Application is live.
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-22T09:00:00Z'
                    errors: []
  /api/v1/health/ready:
    get:
      summary: Readiness probe
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      responses:
        '200':
          description: Application is ready
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                ready:
                  summary: English readiness response
                  value:
                    data:
                      status: ready
                      message: Application is ready.
                    meta:
                      request_id: 8026848e-b092-4041-8062-d6d2c3f8d0c6
                      timestamp: '2026-08-22T09:00:01Z'
                    errors: []
        '503':
          description: Service unavailable
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                dependencyUnavailable:
                  summary: Readiness dependency unavailable
                  value:
                    errors:
                      - code: service_unavailable
                        message: Service is temporarily unavailable.
                    request_id: a9fe75dc-5233-4ca2-bf76-45745af67d6d
                    timestamp: '2026-08-23T09:00:02Z'
  /api/v1/auth/login:
    post:
      summary: Authenticate a staff user
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Authenticated
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                created:
                  summary: English login response
                  value:
                    data:
                      access_token: token
                      refresh_token: refresh
                      token_type: Bearer
                      expires_in: 900
                      message: Login succeeded.
                      session:
                        id: 1d4d7d56-332f-4eb2-a32e-2c79a350af43
                      user:
                        id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                        email: admin@example.com
                        role: admin
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-23T09:00:00Z'
                    errors: []
                createdUrdu:
                  summary: Urdu login response
                  value:
                    data:
                      access_token: token
                      refresh_token: refresh
                      token_type: Bearer
                      expires_in: 900
                      message: لاگ اِن کامیاب رہا۔
                      session:
                        id: 1d4d7d56-332f-4eb2-a32e-2c79a350af43
                      user:
                        id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                        email: admin@example.com
                        role: admin
                    meta:
                      request_id: 5f9c04b6-6c40-4c08-bc6d-4186b3834c26
                      timestamp: '2026-08-23T09:00:00Z'
                    errors: []
        '400':
          description: Missing parameter
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingParameter:
                  value:
                    errors:
                      - code: bad_request
                        field: auth
                        message: A required parameter is missing.
                    request_id: 40f8cc3a-87e8-4973-a6a1-9c8dfcc55f44
                    timestamp: '2026-08-23T09:00:03Z'
        '401':
          description: Invalid credentials
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidCredentialsEn:
                  value:
                    errors:
                      - code: unauthorized
                        message: Invalid credentials.
                    request_id: 7cc9f1f9-53e4-4e64-98f6-d7e2f4b89d39
                    timestamp: '2026-08-23T09:00:04Z'
                invalidCredentialsUr:
                  value:
                    errors:
                      - code: unauthorized
                        message: درست اسناد فراہم نہیں کی گئیں۔
                    request_id: 7cc9f1f9-53e4-4e64-98f6-d7e2f4b89d39
                    timestamp: '2026-08-23T09:00:04Z'
        '403':
          description: Inactive account
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                inactiveAccountEn:
                  value:
                    errors:
                      - code: inactive_account
                        message: This account is inactive.
                    request_id: 7cc9f1f9-53e4-4e64-98f6-d7e2f4b89d39
                    timestamp: '2026-08-23T09:00:04Z'
                inactiveAccountUr:
                  value:
                    errors:
                      - code: inactive_account
                        message: یہ اکاؤنٹ غیر فعال ہے۔
                    request_id: 7cc9f1f9-53e4-4e64-98f6-d7e2f4b89d39
                    timestamp: '2026-08-23T09:00:04Z'
        '429':
          description: Rate limited
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                rateLimitedEn:
                  value:
                    errors:
                      - code: rate_limited
                        message: Too many authentication attempts. Please try again later.
                rateLimitedUr:
                  value:
                    errors:
                      - code: rate_limited
                        message: بہت زیادہ لاگ اِن یا سیشن کی کوششیں ہو چکی ہیں۔ براہ کرم بعد میں دوبارہ کوشش کریں۔
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token rotated
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                refreshedEn:
                  value:
                    data:
                      access_token: token
                      refresh_token: rotated_refresh
                      token_type: Bearer
                      expires_in: 900
                      message: Session refreshed.
                      session:
                        id: 1d4d7d56-332f-4eb2-a32e-2c79a350af43
                      user:
                        id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                        email: admin@example.com
                        role: admin
                    meta:
                      request_id: 70457c01-59a8-46fd-a488-04d2d89c0dc4
                      timestamp: '2026-08-23T09:00:05Z'
                    errors: []
                refreshedUr:
                  value:
                    data:
                      access_token: token
                      refresh_token: rotated_refresh
                      token_type: Bearer
                      expires_in: 900
                      message: سیشن تازہ کر دیا گیا ہے۔
                      session:
                        id: 1d4d7d56-332f-4eb2-a32e-2c79a350af43
                      user:
                        id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                        email: admin@example.com
                        role: admin
                    meta:
                      request_id: 70457c01-59a8-46fd-a488-04d2d89c0dc4
                      timestamp: '2026-08-23T09:00:05Z'
                    errors: []
        '400':
          description: Missing parameter
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid refresh token
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidRefresh:
                  value:
                    errors:
                      - code: invalid_refresh_token
                        message: Invalid or expired refresh token.
                    request_id: 70457c01-59a8-46fd-a488-04d2d89c0dc4
                    timestamp: '2026-08-23T09:00:05Z'
                revokedSession:
                  value:
                    errors:
                      - code: session_revoked
                        message: Session revoked.
                    request_id: 70457c01-59a8-46fd-a488-04d2d89c0dc4
                    timestamp: '2026-08-23T09:00:05Z'
        '429':
          description: Rate limited
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                refreshRateLimitedEn:
                  value:
                    errors:
                      - code: rate_limited
                        message: Too many authentication attempts. Please try again later.
  /api/v1/auth/logout:
    delete:
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                revoked:
                  summary: English logout response
                  value:
                    data:
                      revoked: true
                      message: Session revoked.
                    meta:
                      request_id: 41775a72-a960-4c9c-a319-eb6757ce96d0
                      timestamp: '2026-08-23T09:00:06Z'
                    errors: []
                revokedReplay:
                  summary: Idempotent logout replay
                  value:
                    data:
                      revoked: true
                      message: Session revoked.
                    meta:
                      request_id: 41775a72-a960-4c9c-a319-eb6757ce96d0
                      timestamp: '2026-08-23T09:00:06Z'
                    errors: []
        '401':
          description: Invalid access token
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Idempotency conflict or in-progress request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                fingerprintConflict:
                  value:
                    errors:
                      - code: idempotency_conflict
                        message: The idempotency key does not match the original request.
                    request_id: 0f0d088d-f8b0-4550-bcc4-a8f9434db820
                    timestamp: '2026-08-23T09:00:07Z'
                inProgress:
                  value:
                    errors:
                      - code: idempotency_in_progress
                        message: A request with this idempotency key is already being processed.
