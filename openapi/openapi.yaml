        Full, unmasked staff-facing candidate detail -- distinct from
        CandidateProfile (the candidate's own masked self-service view).
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        cnic:
          type: string
          example: 42101-1234567-1
        mobile_number:
          type: string
        passport_number:
          type: string
          nullable: true
        next_of_kin_name:
          type: string
          nullable: true
        next_of_kin_relationship:
          type: string
          nullable: true
        next_of_kin_mobile_number:
          type: string
          nullable: true
        next_of_kin_cnic:
          type: string
          nullable: true
        preferred_locale:
          type: string
          enum: [en, ur]
        candidate_status:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: The more recent of the candidate's and its current assignment's own updated_at -- echo this back as expected_updated_at on a subsequent update to guard against a stale write.
        assignment:
          $ref: '#/components/schemas/AdminCandidateAssignmentSummary'
      required: [id, full_name, cnic, mobile_number, preferred_locale, candidate_status, active, created_at]
    AdminCandidateCreateRequest:
      type: object
      properties:
        candidate:
          type: object
          required: [full_name, cnic, mobile_number, preferred_locale, country_code, project_code, craft_code, reference_number]
          properties:
            full_name:
              type: string
            cnic:
              type: string
              example: 42101-1234567-1
            mobile_number:
              type: string
              description: Stored as the candidate's own CNIC/OTP login identifier.
            passport_number:
              type: string
            next_of_kin_name:
              type: string
            next_of_kin_relationship:
              type: string
            next_of_kin_mobile_number:
              type: string
            next_of_kin_cnic:
              type: string
            preferred_locale:
              type: string
              enum: [en, ur]
            country_code:
