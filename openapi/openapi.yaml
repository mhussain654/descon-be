  /api/v1/admin/candidate_imports:
    get:
      summary: List the authenticated staff actor's candidate import history
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filter[status]
          in: query
          schema: { type: string, enum: [queued, processing, completed, partial, failed, invalidated] }
        - name: filter[actor_id]
          in: query
          schema: { type: string, format: uuid }
        - name: filter[created_from]
          in: query
          schema: { type: string, format: date }
        - name: filter[created_to]
          in: query
          schema: { type: string, format: date }
        - name: filter[template_version]
          in: query
          schema: { type: string, example: v1 }
        - name: page[number]
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page[size]
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated safe import history. Scope is limited to batches owned by the authenticated actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403': { description: Missing candidate-management permission }
        '422': { description: Invalid filter or pagination parameter }
    post:
      summary: Import candidates from CSV
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateImportRequest'
      responses:
        '201':
          description: >-
            Import request accepted and processed. At least one row was persisted as a new
            candidate. Row-level problems (invalid field values, in-file or database
            duplicates, blank rows) do not cause a 4xx response — they are reported per-row
            inside `data.errors`, alongside the `successful_rows`/`failed_rows`/`skipped_rows`
            counts. Only file-level or request-level problems (missing file, wrong content
            type, unreadable CSV, missing required headers, too many rows) are returned as
            `422`.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                imported:
                  value:
                    data:
                      successful_rows: 2
                      failed_rows: 0
                      skipped_rows: 0
                      total_rows: 2
                      errors: []
                    meta:
                      request_id: 915c82bc-5f8f-4ce8-90d8-fafc418ea0df
                      timestamp: '2026-08-26T09:00:11Z'
                    errors: []
        '200':
          description: >-
            Import request accepted and processed, but no row was persisted as a new
            candidate (every row was invalid, blank, or a duplicate). As with `201`, these
            are row-level outcomes reported in `data.errors`, not request-level `422`
            failures — the request itself was well-formed and was fully processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                importWithErrors:
                  value:
                    data:
                      successful_rows: 0
                      failed_rows: 1
                      skipped_rows: 1
                      total_rows: 2
                      errors:
                        - row: 2
                          field: cnic
                          code: invalid_cnic
                          message: Enter a valid CNIC in the format 00000-0000000-0.
                        - row: 3
                          field: reference_number
                          code: duplicate_reference_number
                          message: A candidate assignment with this reference number already exists.
                    meta:
                      request_id: 915c82bc-5f8f-4ce8-90d8-fafc418ea0df
                      timestamp: '2026-08-26T09:00:11Z'
                    errors: []
        '401':
          description: Missing or invalid staff authentication
        '403':
          description: Authenticated staff user lacks the required permission or is inactive
        '409':
          description: Idempotency conflict or in-progress request
        '422':
          description: >-
            Request-level failure before any row was processed: missing file, invalid file
            type or size, unreadable/malformed CSV, or missing required CSV headers. This
            does not cover invalid row content (bad CNIC format, unknown reference codes,
            duplicate rows, etc.) — those are row-level outcomes returned inside a `200`/`201`
            response's `data.errors` array, not this status.
  /api/v1/admin/candidate_imports/preflight:
    post:
      summary: Validate a versioned candidate import CSV without creating candidates
      description: Persists an encrypted, expiring server-side snapshot. Commit accepts only its opaque token.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CandidateImportRequest' }
      responses:
        '201': { description: Preflight completed with accepted and rejected row results. }
        '403': { description: Missing candidate-management permission }
        '422': { description: Invalid file, template version, or CSV structure }
  /api/v1/admin/candidate_imports/commit:
    post:
      summary: Commit accepted rows from a candidate import preflight
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateImportPreflightCommitRequest' }
      responses:
        '202':
          description: Accepted for asynchronous processing. The history detail endpoint is authoritative for final row results.
        '403': { description: Missing candidate-management permission }
        '409': { description: Idempotency conflict or concurrent request }
        '422': { description: Invalid or expired preflight token }
  /api/v1/admin/candidate_imports/{id}:
    get:
      summary: Show a candidate import batch and safe row results
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Import batch detail. Encrypted payloads, raw CSV content, tokens, and internal exceptions are never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404': { description: Batch is not visible to the authenticated actor }
  /api/v1/admin/candidate_imports/{id}/error_export:
    get:
      summary: Download rejected and skipped import row errors as UTF-8 CSV
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XLocaleHeader'
      responses:
        '200':
          description: Safe error report containing row number, status, field, code, and localized message only.
          content:
            text/csv:
              schema: { type: string, format: binary }
        '404': { description: Batch is not visible to the authenticated actor }
  /api/v1/admin/candidate_imports/{candidate_import_id}/retry:
    post:
      summary: Retry an unexpired failed import batch
      description: >-
        Requeues only failed batches. Concurrent retries are serialized; the successful request enqueues one job,
        while idempotent replays return the original accepted result. A prior enqueued timestamp never prevents a failed batch retry.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: candidate_import_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202': { description: Failed batch requeued for asynchronous execution. }
        '409': { description: Idempotency conflict or request already in progress. }
        '422': { description: Batch is not failed, is expired, or cannot be retried. }
  /api/v1/admin/candidate_imports/template:
    get:
      summary: Download the versioned candidate import CSV template
      description: >-
        Returns the UTF-8 `candidate-import-template-v1.csv` file. Required columns
        match the existing candidate-import parser; passport and next-of-kin columns are optional.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: CSV template with a synthetic example row
          content:
            text/csv:
              schema: { type: string, format: binary }
        '403': { description: Staff user lacks candidate-management permission }
  /api/v1/admin/candidates:
    get:
      summary: List candidates for authorized staff
      description: Searches normalized CNIC, passport, and reference identifiers exactly; full_name supports partial matching.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: filter[status]
          in: query
          schema: { type: string }
        - name: filter[country_code]
          in: query
          schema: { type: string }
        - name: filter[project_code]
          in: query
          schema: { type: string }
        - name: filter[craft_code]
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [created_at, -created_at, full_name, -full_name, reference_number, -reference_number] }
        - name: page[number]
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page[size]
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Paginated candidate results with applied_filters metadata }
        '400': { description: Invalid filter, sort, or pagination parameter }
        '403': { description: Staff user lacks candidate-view permission }
    post:
      summary: Create a candidate and its initial assignment
      description: >-
        Creates a single candidate (source_code admin_ui) plus its initial
        assignment (project/country/craft/reference_number), always starting
        at the registered stage and immediately auto-advancing to
        documents_pending (no document requirements yet exist to block it).
        CNIC, mobile number and passport number (if given) must each be
        unique across all candidates.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCandidateCreateRequest'
      responses:
        '201':
          description: Candidate created or replayed idempotently
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivateNoStoreHeader'
            ETag:
              $ref: '#/components/headers/EntityTagHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                created:
                  value:
                    data:
                      id: bbe3e0b4-9237-4e8d-9bd7-04fe0e9ce8dd
                      full_name: Jane Applicant
                      cnic: 42101-1234567-1
                      mobile_number: '+923001234567'
                      passport_number: null
                      preferred_locale: en
                      candidate_status: documents_pending
                      active: true
                      created_at: '2026-09-15T10:00:00Z'
                      updated_at: '2026-09-15T10:00:00Z'
                      assignment:
                        id: 4cc9b4c8-f690-4ff3-b9fc-6ab3e7eab867
                        reference_number: DES-000123
                        country: { code: qatar, name: Qatar }
                        project: { code: qatar_infrastructure, name: Qatar Infrastructure }
                        craft: { code: electrician, name: Electrician }
                        current_workflow_stage: { code: documents_pending, name: Documents Pending }
                        fields_editable: true
                        created_at: '2026-09-15T10:00:00Z'
                    meta:
                      request_id: 92a1d41e-d4aa-4bf3-9838-c0af7080f363
                      timestamp: '2026-09-15T10:00:00Z'
                    errors: []
        '401':
          description: Missing, invalid, expired, or revoked staff session
        '403':
          description: Authenticated staff user lacks manage_candidates or is inactive
        '409':
          description: Idempotency conflict or in-progress request
        '422':
          description: >-
            Missing/invalid field, duplicate CNIC, duplicate mobile number,
            duplicate passport number, duplicate reference number, or unknown
            country/project/craft code
          content:
