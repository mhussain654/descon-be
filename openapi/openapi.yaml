openapi: 3.1.0
info:
  title: Descon Manpower API
  version: 1.0.0
components:
  parameters:
    XLocaleHeader:
      in: header
      name: X-Locale
      schema:
        type: string
      description: Preferred response locale, for example `en` or `ur`.
    AcceptLanguageHeader:
      in: header
      name: Accept-Language
      schema:
        type: string
      description: RFC 9110 language preferences used when `X-Locale` is not provided or unsupported.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      schema:
        type: string
        pattern: '^[A-Za-z0-9:_-]{1,128}$'
        maxLength: 128
      description: Optional idempotency key for replay-safe mutation requests. Keys are scoped per operation and authenticated subject, retained for 12 hours, replay the original safe response for an identical request, return `409` while an identical request is still processing, and return `409` if the same key is reused with a different request fingerprint.
    RequiredIdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9:_-]{1,128}$'
        maxLength: 128
      description: Required idempotency key for replay-safe mutation requests. Keys are scoped per operation and authenticated subject, retained for 12 hours, replay the original safe response for an identical request, return `409` while an identical request is still processing, and return `409` if the same key is reused with a different request fingerprint.
    PageNumber:
      in: query
      name: page[number]
      schema:
        type: integer
        minimum: 1
      description: 1-based page number.
    PageSize:
      in: query
      name: page[size]
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Number of records per page. Values above 100 are rejected.
    UserSort:
      in: query
      name: sort
      schema:
        type: string
        enum: [created_at, -created_at, email, -email, public_id, -public_id, role, -role, staff_state, -staff_state]
      description: Allowlisted sort fields for user collections.
    UserRoleFilter:
      in: query
      name: filter[role]
      schema:
        type: string
      description: Comma-separated role codes.
    UserActiveFilter:
      in: query
      name: filter[active]
      schema:
        type: string
        enum: ['true', 'false']
      description: Filter by active state. Only `true` and `false` are accepted.
    UserEmailFilter:
      in: query
      name: filter[email]
      schema:
        type: string
      description: Case-insensitive partial match on email.
    UserStaffStateFilter:
      in: query
      name: filter[staff_state]
      schema:
        type: string
      description: Comma-separated staff states. Supported values are `invited`, `active`, and `suspended`.
    DocumentSubmissionStatusFilter:
      in: query
      name: filter[status]
      schema:
        type: string
      description: Comma-separated review states. Supported values are `pending_review`, `partially_reviewed`, `changes_required`, `verified`, `rejected`, `expired_pcc`, and `near_expiry_pcc`.
    DocumentSubmissionCandidateFilter:
      in: query
      name: filter[candidate_public_id]
      schema:
        type: string
        format: uuid
      description: Filter by candidate public ID.
    DocumentSubmissionProjectFilter:
      in: query
      name: filter[project_code]
      schema:
        type: string
      description: Filter by project code.
    DocumentSubmissionCountryFilter:
      in: query
      name: filter[country_code]
      schema:
        type: string
      description: Filter by country code.
    DocumentSubmissionSubmittedFromFilter:
      in: query
      name: filter[submitted_from]
      schema:
        type: string
        format: date-time
      description: Include submissions created on or after this ISO 8601 timestamp.
    DocumentSubmissionSubmittedToFilter:
      in: query
      name: filter[submitted_to]
      schema:
        type: string
        format: date-time
      description: Include submissions created on or before this ISO 8601 timestamp.
  headers:
    ContentLanguageHeader:
      schema:
        type: string
      description: Locale used for the translated parts of the standard JSON API response.
    CacheControlPrivateNoStoreHeader:
      schema:
        type: string
        example: private, no-store
      description: Prevents shared caches from storing sensitive candidate or workflow data.
    EntityTagHeader:
      schema:
        type: string
      description: Opaque freshness validator for authoritative state responses.
    VaryLanguageHeaders:
      schema:
        type: string
        example: Accept-Language, X-Locale
      description: Indicates that caches should vary on locale request headers.
    RequestIdHeader:
      schema:
        type: string
      description: Correlation identifier for the request lifecycle.
    IdempotencyReplayedHeader:
      schema:
        type: string
        example: 'true'
      description: Present when a prior successful response was replayed for the same idempotency key.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    candidateBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        summary:
          $ref: '#/components/schemas/AdminDocumentReviewQueueSummary'
      required: [request_id, timestamp]
    AdminDocumentReviewQueueSummary:
      type: object
      description: >-
        Distinct-candidate counts per review bucket, present only on the
        admin document-submissions queue index. Scoped by every active
        filter except `filter[status]`, so each count reflects what
        selecting that status chip would show.
      properties:
        pending_review:
          type: integer
        verified:
          type: integer
        rejected:
          type: integer
        expired_pcc:
          type: integer
        near_expiry_pcc:
          type: integer
      required: [pending_review, verified, rejected, expired_pcc, near_expiry_pcc]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer
      required: [page, per_page, total_count, total_pages]
    ErrorItem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message]
    ErrorEnvelope:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [errors, request_id, timestamp]
    LoginRequest:
      type: object
      properties:
        auth:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
            password:
              type: string
      required: [auth]
    RefreshRequest:
      type: object
      properties:
        auth:
          type: object
          required: [refresh_token]
          properties:
            refresh_token:
              type: string
      required: [auth]
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, hr, mps, finance, management]
        permissions:
          type: array
          items:
            type: string
      required: [id, email, role, permissions]
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, hr, mps, finance, management]
        staff_state:
          type: string
          enum: [invited, active, suspended]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, email, role, staff_state, active, created_at]
    UserCreateRequest:
      type: object
      properties:
        user:
          type: object
          required: [email, role]
          properties:
            email:
              type: string
              format: email
            role:
              type: string
              enum: [admin, hr, mps, finance, management]
      required: [user]
    UserUpdateRequest:
      type: object
      properties:
        user:
          type: object
          properties:
            role:
              type: string
              enum: [admin, hr, mps, finance, management]
            staff_state:
              type: string
              enum: [active, suspended]
      required: [user]
    UserInvitationAcceptanceRequest:
      type: object
      properties:
        invitation:
          type: object
          required: [token, password, password_confirmation]
          properties:
            token:
              type: string
            password:
              type: string
              minLength: 8
            password_confirmation:
              type: string
              minLength: 8
      required: [invitation]
    SessionPayload:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        session:
          type: object
          properties:
            id:
              type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      required: [access_token, refresh_token, token_type, expires_in, session, user]
    CandidateOtpRequestRequest:
      type: object
      properties:
        candidate:
          type: object
          required: [cnic]
          properties:
            cnic:
              type: string
              example: 42101-1234567-1
      required: [candidate]
    CandidateOtpRequestResponse:
      type: object
      properties:
        expires_in_seconds:
          type: integer
          description: How long a requested code remains valid for, once sent. Present identically whether or not the CNIC actually resolved to a candidate.
        resend_after_seconds:
          type: integer
          description: Minimum time before another code may be requested for the same CNIC.
      required: [expires_in_seconds, resend_after_seconds]
    CandidateOtpVerifyRequest:
      type: object
      properties:
        candidate:
          type: object
          required: [cnic, otp]
          properties:
            cnic:
              type: string
              example: 42101-1234567-1
            otp:
              type: string
              example: '123456'
      required: [candidate]
    CandidateProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        masked_cnic:
          type: string
          example: 42101-*******-1
        reference_number:
          type: string
        preferred_locale:
          type: string
          enum: [en, ur]
        candidate_status:
          type: string
          example: registered
        current_workflow_stage:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
          required: [code, name]
        payment:
          $ref: '#/components/schemas/CandidatePaymentEligibility'
        active:
          type: boolean
      required: [id, full_name, masked_cnic, reference_number, preferred_locale, candidate_status, payment, active]
    CandidateBankProofMetadata:
      type: object
      properties:
        file_name:
          type: string
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        file_size:
          type: integer
        uploaded_at:
          type: string
          format: date-time
      required: [file_name, content_type, file_size, uploaded_at]
    CandidateBankDetailRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [submitted]
        account_title:
          type: string
        account_number:
          type: string
          description: Masked candidate-facing account number that preserves no more than the final four characters.
        bank_name:
          type: string
        proof:
          $ref: '#/components/schemas/CandidateBankProofMetadata'
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, status, account_title, account_number, bank_name, proof, submitted_at, updated_at]
    CandidateBankDetailState:
      type: object
      properties:
        status:
          type: string
          enum: [missing, submitted]
        bank_detail:
          anyOf:
            - $ref: '#/components/schemas/CandidateBankDetailRecord'
            - type: 'null'
        message:
          type: string
      required: [status, bank_detail]
    CandidateBankDetailUpsertRequest:
      type: object
      properties:
        bank_detail:
          type: object
          required: [account_title, account_number, bank_name, proof]
          properties:
            account_title:
              type: string
            account_number:
              type: string
              description: Account number or IBAN. The backend strips spaces and validates the normalized alphanumeric value.
            bank_name:
              type: string
            proof:
              type: string
              format: binary
      required: [bank_detail]
    AdminCandidateBankDetailCandidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
      required: [id, full_name]
    AdminCandidateBankDetailAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference_number:
          type: string
      required: [id, reference_number]
    AdminCandidateBankDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidate:
          $ref: '#/components/schemas/AdminCandidateBankDetailCandidate'
        assignment:
          $ref: '#/components/schemas/AdminCandidateBankDetailAssignment'
        status:
          type: string
          enum: [submitted]
        account_title:
          type: string
        account_number:
          type: string
          description: Masked unless the authenticated staff policy grants unmasked banking access.
        bank_name:
          type: string
        proof:
          $ref: '#/components/schemas/CandidateBankProofMetadata'
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, candidate, assignment, status, account_title, account_number, bank_name, proof, submitted_at, updated_at]
    AdminCandidateBankProofAccess:
      type: object
      properties:
        bank_detail_id:
          type: string
          format: uuid
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [bank_detail_id, url, expires_at]
    CandidateDocumentMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        file_size:
          type: integer
        uploaded_at:
          type: string
          format: date-time
        issued_on:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          description: Present only for the `police_character` requirement.
        expires_on:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          description: Present only for the `police_character` requirement and calculated by the backend as exactly six calendar months after `issued_on`.
        compliance_status:
          anyOf:
            - type: string
              enum: [current, near_expiry, expired, not_applicable]
            - type: 'null'
          description: Present only for the `police_character` requirement. Non-PCC responses omit the field instead of returning `not_applicable`.
        reviewed_at:
          type: string
          format: date-time
          description: Present only once the document has been verified or rejected.
        rejection_reason:
          type: string
          description: Present only when this document's current status is `rejected`.
      required: [id, file_name, content_type, file_size, uploaded_at]
    CandidateDocumentChecklistItem:
      type: object
      properties:
        requirement_code:
          type: string
          example: passport
        name:
          type: string
        required:
          type: boolean
        status:
          type: string
          enum: [missing, uploaded, pending_review, verified, rejected]
        replacement_allowed:
          type: boolean
        document:
          anyOf:
            - $ref: '#/components/schemas/CandidateDocumentMetadata'
            - type: 'null'
      required: [requirement_code, name, required, status, replacement_allowed, document]
    CandidateDocumentUploadRequest:
      type: object
      properties:
        candidate_document:
          type: object
          required: [requirement_code, file]
          properties:
            requirement_code:
              type: string
              example: passport
            file:
              type: string
              format: binary
            issued_on:
              type: string
              format: date
              description: Required when `requirement_code=police_character`. Must be a valid ISO date in `YYYY-MM-DD` format and cannot be in the future.
            expires_on:
              type: string
              format: date
              description: Must not be supplied by clients. The backend rejects this field and calculates PCC expiry automatically.
      required: [candidate_document]
    CandidateBlockingRequirement:
      type: object
      properties:
        requirement_code:
          type: string
          example: passport
        name:
          type: string
        reason:
          type: string
          enum: [missing, rejected, expired]
      required: [requirement_code, name, reason]
    CandidateProgressWorkflowStage:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required: [code, name]
    CandidateWorkflowTimelineStage:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        position:
          type: integer
        status:
          type: string
          enum: [completed, current, pending]
        started_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required: [code, name, position, status]
    WorkflowTransitionEvidence:
      type: object
      additionalProperties: false
      properties:
        appointment_date:
          type: string
          format: date
        qvc_outcome_code:
          type: string
          enum: [approved, re_medical, rejected]
        visa_outcome_code:
          type: string
          enum: [issued, rejected]
        visa_outcome_date:
          type: string
          format: date
        appeared_for_protection_on:
          type: string
          format: date
        protected_on:
          type: string
          format: date
        flight_reference:
          type: string
        flight_date:
          type: string
          format: date
        mobilized_on:
          type: string
          format: date
    WorkflowTransitionHistoryDetails:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
        appointment_date:
          type: string
          format: date
        qvc_outcome_code:
          type: string
          enum: [approved, re_medical, rejected]
        visa_outcome_code:
          type: string
          enum: [issued, rejected]
        visa_outcome_date:
          type: string
          format: date
        appeared_for_protection_on:
          type: string
          format: date
        protected_on:
          type: string
          format: date
        flight_reference:
          type: string
        flight_date:
          type: string
          format: date
        mobilized_on:
          type: string
          format: date
    CandidateWorkflowProgress:
      type: object
      properties:
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/CandidateWorkflowTimelineStage'
        completed_count:
          type: integer
        total_count:
          type: integer
        progress_percentage:
          type: integer
          minimum: 0
          maximum: 100
        updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required: [timeline, completed_count, total_count, progress_percentage, updated_at]
    CandidatePaymentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        payment_type_code:
          type: string
          example: onboarding_fee
        status:
          type: string
          enum: [checkout_pending, paid, failed, cancelled]
        amount:
          type: string
          example: '1500.0'
        currency_code:
          type: string
          example: PKR
        provider:
          type: string
          enum: [mock_hosted_checkout, kuickpay]
        checkout_url:
          anyOf:
            - type: string
            - type: 'null'
        checkout_expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        paid_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required: [id, payment_type_code, status, amount, currency_code, provider]
    CandidatePaymentEligibility:
      type: object
      properties:
        eligible:
          type: boolean
        checkout_available:
          type: boolean
        required_stage_code:
          type: string
          example: fee_pending
        current_stage_code:
          anyOf:
            - type: string
            - type: 'null'
        blocking_reasons:
          type: array
          items:
            type: string
            enum:
              - no_current_assignment
              - payment_stage_not_reached
              - required_documents_not_verified
              - payment_already_completed
              - payment_provider_unavailable
        amount:
          type: string
          example: '1500.0'
        currency_code:
          type: string
          example: PKR
        latest_payment:
          anyOf:
            - $ref: '#/components/schemas/CandidatePaymentRecord'
            - type: 'null'
      required:
        - eligible
        - checkout_available
        - required_stage_code
        - current_stage_code
        - blocking_reasons
        - amount
        - currency_code
        - latest_payment
    CandidatePaymentCheckoutResponse:
      type: object
      properties:
        eligibility:
          $ref: '#/components/schemas/CandidatePaymentEligibility'
        payment:
          $ref: '#/components/schemas/CandidatePaymentRecord'
      required: [eligibility, payment]
    AdminPaymentCandidateRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        masked_cnic:
          type: string
          example: 42101-*******-1
        reference_number:
          type: string
      required: [id, full_name, masked_cnic, reference_number]
    AdminPaymentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidate:
          $ref: '#/components/schemas/AdminPaymentCandidateRef'
        payment_type_code:
          type: string
        status:
          type: string
          enum: [checkout_pending, paid, failed, cancelled]
        amount:
          type: string
          example: '1500.00'
        currency_code:
          type: string
          example: PKR
        provider:
          type: string
        external_reference:
          type: string
          nullable: true
        reconciliation_state:
          type: string
          enum: [clean, open, resolved]
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, candidate, payment_type_code, status, amount, currency_code, provider, reconciliation_state, created_at,
                 updated_at]
    AdminPaymentEventActorRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
      required: [id, role]
    AdminPaymentEvent:
      type: object
      description: >-
        A safe, staff-facing view of one payment event. Never includes the raw provider
        callback/return payload, provider secrets, signatures, or internal correlation
        identifiers -- only what a staff member needs to understand what happened and when.
      properties:
        id:
          type: string
        event_type:
          type: string
        event_source:
          type: string
        provider_status_code:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
        actor:
          allOf: [{ $ref: '#/components/schemas/AdminPaymentEventActorRef' }]
          nullable: true
      required: [id, event_type, event_source, occurred_at]
    AdminPaymentReconciliationFinding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        finding_code:
          type: string
          enum: [paid_at_missing, external_reference_missing, duplicate_external_reference, workflow_payment_mismatch,
                 terminal_event_conflict]
        state:
          type: string
          enum: [open, resolved]
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          allOf: [{ $ref: '#/components/schemas/AdminPaymentEventActorRef' }]
          nullable: true
        resolution_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, finding_code, state, created_at]
    AdminPaymentDetail:
      allOf:
        - $ref: '#/components/schemas/AdminPaymentSummary'
        - type: object
          properties:
            payment_events:
              type: array
              items: { $ref: '#/components/schemas/AdminPaymentEvent' }
            reconciliation_findings:
              type: array
              items: { $ref: '#/components/schemas/AdminPaymentReconciliationFinding' }
          required: [payment_events, reconciliation_findings]
    AdminPaymentCorrectionRequest:
      type: object
      description: >-
        Applies a narrow, backend-validated correction to one payment. `field` is one of
        `external_reference`, `paid_at`, `status_code`, or omitted entirely for a "note-only"
        finding resolution. `status_code` may only move to `paid` when `finding_id` references
        an open `terminal_event_conflict` finding on this same payment (the backend
        additionally confirms a real `payment_succeeded` event already exists before allowing
        it) -- a correction can never stand in for real provider confirmation. `expected_updated_at`
        must match the payment's current `updated_at` (from the last detail fetch) or the
        request is rejected as stale (409).
      properties:
        reason:
          type: string
          minLength: 1
        expected_updated_at:
          type: string
          format: date-time
        finding_id:
          type: string
          format: uuid
        field:
          type: string
          enum: [external_reference, paid_at, status_code]
        value:
          type: string
      required: [reason, expected_updated_at]
