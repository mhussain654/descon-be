  /api/v1/admin/payments:
    get:
      summary: List payment transactions (finance workspace)
      description: >-
        Paginated, searchable, filterable list of payment transactions. Requires the active
        `view_payments` or `manage_payments` permission. `reconciliation_state` reflects this
        payment's own reconciliation findings (see Payments::ReconciliationService): `clean`
        (never flagged), `open` (at least one unresolved finding), or `resolved` (every
        finding on this payment has been resolved).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Matches candidate full name, assignment reference number, or external_reference.
          schema: { type: string }
        - name: filter[status]
          in: query
          schema: { type: string, enum: [checkout_pending, paid, failed, cancelled] }
        - name: filter[provider_code]
          in: query
          schema: { type: string, example: kuickpay }
        - name: filter[payment_type_code]
          in: query
          schema: { type: string, example: onboarding_fee }
        - name: filter[currency_code]
          in: query
          schema: { type: string, example: PKR }
        - name: filter[created_from]
          in: query
          schema: { type: string, format: date }
        - name: filter[created_to]
          in: query
          schema: { type: string, format: date }
        - name: filter[reconciliation_state]
          in: query
          schema: { type: string, enum: [open, resolved, clean] }
        - name: sort
          in: query
          description: 'Prefix with `-` for descending. Defaults to `-created_at`.'
          schema: { type: string, enum: [created_at, -created_at, paid_at, -paid_at, amount, -amount, status_code, -status_code] }
      responses:
        '200':
          description: Paginated payment transaction list
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
