  /api/v1/admin/candidates/{candidate_id}/flight_detail/ticket_access:
    post:
      summary: Generate a short-lived private access path for the recorded flight ticket
      description: >-
        Returns a private Active Storage proxy path for the ticket attached to
        the candidate's flight detail. The path is time-limited, does not
        expose storage keys, and every successful access is audited. The
        candidate can independently fetch the same short-lived access for
        their own ticket via `POST /api/v1/candidate/flight_detail/ticket_access`.
      security:
        - bearerAuth: []
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
      responses:
        '200':
          description: Short-lived private access path
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguageHeader'
            Vary:
              $ref: '#/components/headers/VaryLanguageHeaders'
            X-Request-Id:
              $ref: '#/components/headers/RequestIdHeader'
            Cache-Control:
              schema:
                type: string
                example: private, no-store
              description: Prevents client or intermediary caching of the access response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              examples:
                access:
                  value:
                    data:
                      flight_detail_id: 3fa1d41e-d4aa-4bf3-9838-c0af7080f363
                      url: /rails/active_storage/blobs/proxy/eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaHBBd0k9IiwiZXhwIjpudWxsLCJwdXIiOiJibG9iX2lkIn19--token/ticket.pdf?disposition=inline
                      expires_at: '2026-09-15T10:05:00Z'
                    meta:
                      request_id: 92a1d41e-d4aa-4bf3-9838-c0af7080f363
                      timestamp: '2026-09-15T10:00:00Z'
                    errors: []
        '401':
          description: Missing, invalid, expired, or revoked staff session
        '403':
          description: Not authorized to view workflow history
        '404':
          description: Flight detail not found
        '422':
          description: Flight detail exists but has no attached ticket
