  /api/v1/admin/candidates/{candidate_id}/qvc_attempts/{id}:
    patch:
      summary: Record a QVC outcome or no-show for an existing attempt
      description: >-
        Records one of the canonical outcome codes `approved`, `re_medical`,
        or `rejected`, or marks the attempt as `no_show`. Outcome timestamps
        are owned by the server. An approved, rejected, or re-medical outcome
        on the first appointment moves the workflow into
        `qvc_completed_outcome_received`; follow-up attempts update only the
        structured attempt history and current QVC summary.
      security:
        - bearerAuth: []
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XLocaleHeader'
        - $ref: '#/components/parameters/AcceptLanguageHeader'
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
